name: Update README change log

on:
  push:
    branches: [main, docs/plan-v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-log-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate change log
        run: python .github/scripts/update_readme_log.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README change log [skip ci]"
          git push
