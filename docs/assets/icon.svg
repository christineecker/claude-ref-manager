<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ref-manager icon: a coral burst character in glasses reading a book with a knowledge graph beside a stack of books, on a teal tile">
  <title>ref-manager</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15908E"/>
      <stop offset="1" stop-color="#0B6564"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#062E2E" flood-opacity=".35"/>
    </filter>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <circle cx="400" cy="104" r="120" fill="#fff" opacity=".06" clip-path="url(#tile)"/>
  <ellipse cx="250" cy="432" rx="190" ry="18" fill="#062E2E" opacity=".25"/>

  <!-- sparkles -->
  <g fill="#F2C14E">
    <path d="M104 96 q5 22 26 26 q-21 4-26 26 q-5-22-26-26 q21-4 26-26z"/>
    <path d="M404 118 q4 18 21 22 q-17 4-21 22 q-4-18-21-22 q17-4 21-22z"/>
  </g>

  <!-- book stack -->
  <g filter="url(#soft)">
    <rect x="46" y="378" width="150" height="46" rx="10" fill="#FFFDF8"/>
    <rect x="40" y="330" width="150" height="46" rx="10" fill="#E3A756"/>
    <rect x="36" y="282" width="150" height="46" rx="10" fill="#7FA7D1"/>
    <rect x="44" y="234" width="146" height="46" rx="10" fill="#A8D5BA"/>
  </g>
  <g fill="#FFFDF8" opacity=".85">
    <rect x="58" y="246" width="100" height="22" rx="5"/>
    <rect x="50" y="294" width="100" height="22" rx="5"/>
    <rect x="54" y="342" width="100" height="22" rx="5"/>
  </g>
  <rect x="60" y="390" width="100" height="22" rx="5" fill="#EDE5D3"/>
  <path d="M70 388 h14 v26 l-7-6 l-7 6z" fill="#4FB3B0"/>

  <!-- coral burst character -->
  <g transform="translate(276 236)" fill="#E07B53">
    <ellipse cx="0" cy="-104" rx="30" ry="62"/>
    <ellipse cx="0" cy="-104" rx="30" ry="62" transform="rotate(33)"/>
    <ellipse cx="0" cy="-104" rx="30" ry="62" transform="rotate(66)"/>
    <ellipse cx="0" cy="-104" rx="30" ry="62" transform="rotate(99)"/>
    <ellipse cx="0" cy="-104" rx="30" ry="62" transform="rotate(261)"/>
    <ellipse cx="0" cy="-104" rx="30" ry="62" transform="rotate(294)"/>
    <ellipse cx="0" cy="-104" rx="30" ry="62" transform="rotate(327)"/>
    <circle r="112"/>
    <path d="M-104 40 Q-120 150 -40 170 H40 Q120 150 104 40z"/>
  </g>

  <!-- face -->
  <g fill="none" stroke="#3A241B" stroke-width="10" stroke-linejoin="round">
    <rect x="196" y="192" width="72" height="58" rx="20"/>
    <rect x="286" y="192" width="72" height="58" rx="20"/>
    <path d="M268 214 q9-8 18 0" stroke-linecap="round"/>
  </g>
  <ellipse cx="234" cy="222" rx="10" ry="15" fill="#3A241B"/>
  <ellipse cx="322" cy="222" rx="10" ry="15" fill="#3A241B"/>
  <path d="M262 272 q16 14 32 0" fill="none" stroke="#3A241B" stroke-width="9" stroke-linecap="round"/>

  <!-- open book -->
  <g filter="url(#soft)">
    <path d="M178 300 L276 318 L276 432 L178 412z" fill="#2E2C30"/>
    <path d="M374 300 L276 318 L276 432 L374 412z" fill="#3A383D"/>
    <path d="M184 296 L276 312 L368 296 L276 318z" fill="#FFFDF8"/>
    <line x1="276" y1="318" x2="276" y2="432" stroke="#1F1E22" stroke-width="6"/>
  </g>
  <g stroke="#9FCFCC" stroke-width="7" stroke-linecap="round">
    <line x1="300" y1="386" x2="322" y2="344"/>
  </g>
  <line x1="322" y1="344" x2="352" y2="378" stroke="#E3A756" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 11"/>
  <line x1="300" y1="386" x2="352" y2="378" stroke="#9FCFCC" stroke-width="7" stroke-linecap="round"/>
  <circle cx="300" cy="386" r="10" fill="#4FB3B0"/>
  <circle cx="322" cy="344" r="10" fill="#4FB3B0"/>
  <circle cx="352" cy="378" r="13" fill="#E3A756"/>

  <!-- hands -->
  <circle cx="178" cy="352" r="22" fill="#E07B53"/>
  <circle cx="374" cy="352" r="22" fill="#E07B53"/>
</svg>
